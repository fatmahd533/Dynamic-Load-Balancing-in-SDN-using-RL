const COMPARE_CHOICES = [
  { id: "shortest_path", name: "Shortest path", note: "always the same route" },
  { id: "random_path", name: "Random path", note: "picks a route at random" },
  { id: "global_rr", name: "Round-robin", note: "takes turns, blind to load" },
  { id: "least_congested", name: "Least-congested", note: "reads the live link load" },
  { id: "lcp_pending", name: "Least-congested + memory", note: "also remembers flows it just placed" },
  { id: "q_learning", name: "Q-learning (trained)", note: "the learning agent" },
];
const COMPARE_NAME = Object.fromEntries(COMPARE_CHOICES.map(c => [c.id, c.name]));

function heatColor(mbps) {
  const u = mbps / 10;
  if (u >= 0.9) return "#ff4d5e";
  if (u >= 0.5) return "#f0a93b";
  if (u >= 0.05) return "#22d3ee";
  return "#1d3b57";
}

function HeatTopology({ linkMbps }) {
  return (
    <svg viewBox="0 0 700 290" className="heat-topo">
      {STATIC_EDGES.map(([a, b]) => {
        const key = a < b ? `${a}-${b}` : `${b}-${a}`;
        const v = linkMbps?.[key] ?? 0;
        const pa = SWITCH_POS[a], pb = SWITCH_POS[b];
        return (
          <line key={key} x1={pa.x} y1={pa.y} x2={pb.x} y2={pb.y}
            stroke={heatColor(v)} strokeWidth={v < 0.05 ? 1.4 : 2 + Math.min(v, 10) * 0.55}
            strokeLinecap="round" opacity={v < 0.05 ? 0.7 : 1} />
        );
      })}
      {Object.entries(SWITCH_POS).map(([id, p]) => (
        <circle key={id} cx={p.x} cy={p.y} r="9" fill={TIER_COLOR[SWITCH_TIER[id]]} opacity="0.95" />
      ))}
      {[["Core", 46], ["Aggregation", 140], ["Edge", 234]].map(([n, y]) => (
        <text key={n} x="6" y={y + 4} fontSize="11" fill="var(--dim)">{n}</text>
      ))}
    </svg>
  );
}

function CompareCard({ algo, result, active, flowsOffered }) {
  const pct = result ? Math.min(100, (result.delivered_mbps / flowsOffered) * 100) : 0;
  const tone = result ? (pct >= 97 ? "good" : pct >= 70 ? "mid" : "bad") : "";
  return (
    <div className={`cmp-card ${active ? "active" : ""}`}>
      <div className="cmp-name">{COMPARE_NAME[algo] || algo}</div>
      {!result ? (
        <div className="cmp-wait">{active ? "running now…" : "waiting"}</div>
      ) : (
        <React.Fragment>
          <div className={`cmp-big ${tone}`}>{result.delivered_mbps.toFixed(1)}<small> Mbps delivered</small></div>
          <div className="cmp-track"><div className={`cmp-fill ${tone}`} style={{ width: `${pct}%` }} /></div>
          <div className="cmp-sub">{pct.toFixed(0)}% of the {flowsOffered.toFixed(1)} Mbps sent</div>
          <HeatTopology linkMbps={result.link_mbps} />
          <div className="cmp-stats">
            <span>busiest link <b className={result.max_link_mbps >= 9 ? "hot" : ""}>{result.max_link_mbps.toFixed(1)}</b> / 10 Mbps</span>
            <span>links used <b>{result.links_used}</b> of 16</span>
          </div>
        </React.Fragment>
      )}
    </div>
  );
}


const ALGO_COLOR = {
  shortest_path: "#ff4d5e", random_path: "#8aa0b5", global_rr: "#b48cff",
  least_congested: "#f0a93b", lcp_pending: "#19d3a8", q_learning: "#3a9bff",
};

// Delivered throughput per second, one line per algorithm.
function TimelineChart({ algos, results, offered }) {
  const W = 760, H = 280, L = 44, R = 150, T = 14, B = 34;
  const have = algos.filter(a => results[a] && results[a].timeline_mbps && results[a].timeline_mbps.length);
  if (have.length === 0) return null;
  const n = Math.max(...have.map(a => results[a].timeline_mbps.length));
  const yMax = Math.ceil(Math.max(offered, ...have.flatMap(a => results[a].timeline_mbps)) / 10) * 10 + 5;
  const x = i => L + ((i) / (n)) * (W - L - R);
  const y = v => T + (1 - v / yMax) * (H - T - B);
  const ticks = [];
  for (let v = 0; v <= yMax; v += 10) ticks.push(v);
  // direct labels at the line ends, nudged apart so they never overlap
  const ends = have.map(a => ({ a, y: y(results[a].timeline_mbps[results[a].timeline_mbps.length - 1]) }))
    .sort((p, q) => p.y - q.y);
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 14) ends[i].y = ends[i - 1].y + 14;
  return (
    <div className="panel gr-panel">
      <h2 className="panel-title">Throughput over time</h2>
      <p className="cmp-text" style={{ margin: 0 }}>
        Total traffic delivered each second, summed over the six flows. A good algorithm reaches the dashed line
        (what was sent) quickly and stays there; a poor one plateaus lower because flows share a saturated link.
      </p>
      <svg viewBox={`0 0 ${W} ${H}`} className="gr-svg" style={{ maxWidth: 1000 }} role="img" aria-label="Delivered throughput over time for each algorithm">
        {ticks.map(v => (
          <g key={v}>
            <line className="gl" x1={L} x2={W - R} y1={y(v)} y2={y(v)} />
            <text x={L - 8} y={y(v) + 4} textAnchor="end">{v}</text>
          </g>
        ))}
        <line className="ax" x1={L} x2={W - R} y1={y(0)} y2={y(0)} />
        {Array.from({ length: n }, (_, i) => i + 1).map(i => (
          <text key={i} x={x(i)} y={H - B + 16} textAnchor="middle">{i}</text>
        ))}
        <text x={(L + W - R) / 2} y={H - 4} textAnchor="middle">seconds since the flows started</text>
        <text x={12} y={T + 6} textAnchor="start">Mbps</text>
        <line x1={L} x2={W - R} y1={y(offered)} y2={y(offered)} stroke="#e6edf5" strokeDasharray="5 4" strokeWidth="1.2" opacity="0.7" />
        <text x={L + 8} y={y(offered) - 6} style={{ fill: "#e6edf5" }}>sent {offered.toFixed(1)} Mbps</text>
        {have.map(a => {
          const pts = results[a].timeline_mbps.map((v, i) => `${x(i + 1)},${y(v)}`).join(" ");
          return <polyline key={a} points={pts} fill="none" stroke={ALGO_COLOR[a] || "#fff"} strokeWidth="2.4"
            strokeLinejoin="round" strokeLinecap="round" />;
        })}
        {ends.map(e => (
          <text key={e.a} x={W - R + 6} y={e.y + 4} style={{ fill: ALGO_COLOR[e.a] || "#fff", fontWeight: 600 }}>
            {(COMPARE_NAME[e.a] || e.a).replace("Least-congested + memory", "LC + memory")}
          </text>
        ))}
      </svg>
    </div>
  );
}

// Load on the 8 edge-to-aggregation links, one small chart per algorithm.
function UplinkBalance({ algos, results }) {
  const have = algos.filter(a => results[a] && results[a].uplink_mbps && results[a].uplink_mbps.length);
  if (have.length === 0) return null;
  const W = 240, H = 130, L = 26, T = 8, B = 20;
  return (
    <div className="panel gr-panel">
      <h2 className="panel-title">Load balance across the 8 edge uplinks</h2>
      <p className="cmp-text" style={{ margin: 0 }}>
        Each bar is one link between an edge and an aggregation switch (10 Mbps capacity, dashed line). An even
        spread means the controller shares the load; tall and empty bars mean some links are overloaded while others idle.
        The balance index is 1.00 when every link carries the same load and falls towards 0.13 when one link carries it all.
      </p>
      <div className="gr-multi">
        {have.map(a => {
          const r = results[a];
          const bw = (W - L - 6) / r.uplink_mbps.length;
          const y = v => T + (1 - Math.min(v, 10.5) / 10.5) * (H - T - B);
          const j = r.jain_uplinks;
          const tone = j >= 0.9 ? "good" : j >= 0.7 ? "mid" : "bad";
          return (
            <div className="gr-mini" key={a}>
              <h3 style={{ color: ALGO_COLOR[a] }}>{COMPARE_NAME[a] || a}</h3>
              <svg viewBox={`0 0 ${W} ${H}`} className="gr-svg" role="img" aria-label={`Uplink load, ${COMPARE_NAME[a] || a}`}>
                {[0, 5, 10].map(v => (
                  <g key={v}>
                    <line className="gl" x1={L} x2={W} y1={y(v)} y2={y(v)} />
                    <text x={L - 5} y={y(v) + 4} textAnchor="end">{v}</text>
                  </g>
                ))}
                <line x1={L} x2={W} y1={y(10)} y2={y(10)} stroke="#e6edf5" strokeDasharray="4 3" opacity="0.6" />
                {r.uplink_mbps.map((u, i) => (
                  <g key={u.link}>
                    <rect x={L + i * bw + 3} y={y(u.mbps)} width={bw - 6} height={Math.max(1, y(0) - y(u.mbps))}
                      rx="2" fill={ALGO_COLOR[a] || "#6f8aa3"} opacity={u.mbps < 0.5 ? 0.25 : 0.95} />
                    <text x={L + i * bw + bw / 2} y={H - 6} textAnchor="middle" style={{ fontSize: 9 }}>{u.link}</text>
                  </g>
                ))}
              </svg>
              <div className="jn">balance index <b className={tone}>{j.toFixed(2)}</b> &nbsp;·&nbsp; busiest uplink <b>{Math.max(...r.uplink_mbps.map(u => u.mbps)).toFixed(1)}</b> Mbps</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function CompareView() {
  const [selected, setSelected] = useState(["shortest_path", "least_congested", "lcp_pending"]);
  const [data, setData] = useState(null);
  const [msg, setMsg] = useState(null);
  const [busy, setBusy] = useState(false);

  const poll = useCallback(() => {
    fetch(`${API}/api/lab/compare`).then(r => r.json()).then(d => {
      if (d && d.state) setData(d);
    }).catch(() => {});
  }, []);
  useEffect(() => {
    poll();
    const id = setInterval(poll, 1500);
    return () => clearInterval(id);
  }, [poll]);

  const running = data?.state === "running";
  const toggle = (id) => setSelected(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);
  const start = () => {
    setMsg(null); setBusy(true);
    const order = COMPARE_CHOICES.map(c => c.id).filter(id => selected.includes(id));
    fetch(`${API}/api/lab/compare`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ algorithms: order, flows: 6 }),
    }).then(r => r.json().then(d => ({ ok: r.ok, d })))
      .then(({ ok, d }) => {
        if (!ok) setMsg(d.detail || "Lab daemon error");
        else if (d.error) setMsg(d.error);
        else poll();
      })
      .catch(() => setMsg(`Can't reach the API at ${API}`))
      .finally(() => setBusy(false));
  };

  const algos = data?.algorithms || [];
  const results = data?.results || {};
  const done = data?.state === "done";
  const offered = data?.offered_mbps || 50.3;
  const ranked = algos.filter(a => results[a]).sort((a, b) => results[b].delivered_mbps - results[a].delivered_mbps);
  const best = ranked[0], worst = ranked[ranked.length - 1];
  const elapsed = running && data?.started ? Math.round(Date.now() / 1000 - data.started) : 0;

  return (
    <div className="cmp-wrap">
      <div className="panel cmp-intro">
        <h2 className="panel-title">Compare routing algorithms on the same traffic</h2>
        <p className="cmp-text">
          Six cross-pod UDP flows (8 Mbps each, 50 Mbps in total) start at the same moment on a network of 10 Mbps links.
          The <b>same six flows</b> are replayed under each algorithm you pick, so the only thing that differs is how the
          controller chooses routes. Takes about 25 seconds per algorithm.
        </p>
        <div className="cmp-choices">
          {COMPARE_CHOICES.map(c => (
            <label key={c.id} className={`cmp-choice ${selected.includes(c.id) ? "on" : ""}`}>
              <input type="checkbox" checked={selected.includes(c.id)} disabled={running}
                onChange={() => toggle(c.id)} />
              <span><b>{c.name}</b><small>{c.note}</small></span>
            </label>
          ))}
        </div>
        <div className="cmp-actions">
          <button className="run" onClick={start} disabled={running || busy || selected.length < 2}>
            {running ? `Running… ${elapsed}s` : "Run comparison"}
          </button>
          {selected.length < 2 && <span className="form-msg hint">Pick at least two.</span>}
          {running && <span className="form-msg hint">{data.current ? `${COMPARE_NAME[data.current] || data.current}: ${data.phase}` : data.phase}</span>}
          {msg && <span className="form-msg err">{msg}</span>}
          {data?.state === "error" && <span className="form-msg err">{data.error}</span>}
        </div>
      </div>

      {algos.length > 0 && (
        <React.Fragment>
          <div className="cmp-grid">
            {algos.map(a => (
              <CompareCard key={a} algo={a} result={results[a]} active={running && data.current === a}
                flowsOffered={offered} />
            ))}
          </div>
          {(done || (data?.results && Object.keys(results).length > 0)) && (
            <React.Fragment>
              <TimelineChart algos={algos} results={results} offered={offered} />
              <UplinkBalance algos={algos} results={results} />
            </React.Fragment>
          )}
          <div className="cmp-legend">
            Link colour: <span style={{ color: "#22d3ee" }}>■</span> lightly used &nbsp;
            <span style={{ color: "#f0a93b" }}>■</span> half full &nbsp;
            <span style={{ color: "#ff4d5e" }}>■</span> saturated (≥ 9 of 10 Mbps) &nbsp;
            <span style={{ color: "#1d3b57" }}>■</span> unused
          </div>
          {done && best && worst && best !== worst && (
            <div className="panel cmp-verdict">
              <b>{COMPARE_NAME[best]}</b> delivered <b>{(results[best].delivered_mbps - results[worst].delivered_mbps).toFixed(1)} Mbps more</b> than{" "}
              <b>{COMPARE_NAME[worst]}</b> on the same flows ({results[best].delivered_mbps.toFixed(1)} against {results[worst].delivered_mbps.toFixed(1)}).
              This is a single run of {data.flows.length} flows (seed {data.seed}); the 15-repetition evidence is on the Results tab.
            </div>
          )}
        </React.Fragment>
      )}
      {algos.length === 0 && (
        <div className="loadmsg">Pick the algorithms and click Run comparison. The network and controller are started for you.</div>
      )}
    </div>
  );
}

// ---------------------------------------------------------------- validated results
const EVIDENCE_SIMULTANEOUS = [
  { n: "Least-congested + memory", v: 50.39, ci: 0.01, t: "good" },
  { n: "Q-learning + memory", v: 50.39, ci: 0.01, t: "good" },
  { n: "Random path", v: 36.18, ci: 2.83, t: "" },
  { n: "Q-learning (no memory)", v: 34.59, ci: 0.88, t: "" },
  { n: "Round-robin", v: 33.67, ci: 0.78, t: "" },
  { n: "Least-congested (no memory)", v: 24.95, ci: 3.07, t: "bad" },
  { n: "Shortest path", v: 19.44, ci: 0, t: "bad" },
];
const EVIDENCE_BACKGROUND = [
  { n: "Least-congested", v: 50.34, ci: 0, t: "good" },
  { n: "Least-congested + memory", v: 50.34, ci: 0, t: "good" },
  { n: "Q-learning (trained)", v: 48.57, ci: 1.68, t: "good" },
  { n: "Q-learning + memory", v: 45.22, ci: 2.43, t: "good" },
  { n: "Round-robin", v: 37.77, ci: 2.43, t: "" },
  { n: "Random path", v: 35.37, ci: 1.63, t: "" },
  { n: "Q-learning (old state)", v: 33.33, ci: 1.55, t: "bad" },
  { n: "Shortest path", v: 20.47, ci: 3.16, t: "bad" },
];


const EVIDENCE_EIGHT = [
  { n: "Least-congested + memory", v: 67.24, ci: 0.01, t: "good" },
  { n: "Random path", v: 41.34, ci: 3.04, t: "" },
  { n: "Q-learning (trained on 6 flows)", v: 38.90, ci: 0.01, t: "" },
  { n: "Least-congested (no memory)", v: 29.09, ci: 3.96, t: "bad" },
  { n: "Shortest path", v: 19.45, ci: 0.01, t: "bad" },
];
const EVIDENCE_MIXED = [
  { n: "Least-congested + memory", v: 25.19, ci: 0, t: "good" },
  { n: "Q-learning (trained)", v: 20.21, ci: 0, t: "" },
  { n: "Random path", v: 19.10, ci: 0, t: "" },
  { n: "Least-congested, class-aware", v: 18.32, ci: 0, t: "" },
  { n: "Least-congested (no memory)", v: 17.48, ci: 0, t: "bad" },
  { n: "Shortest path", v: 16.52, ci: 0, t: "bad" },
];
const EVIDENCE_FAILURE = [
  { n: "Least-congested", v: 28, ci: 6, t: "good" },
  { n: "Shortest path", v: 34, ci: 1, t: "good" },
];
const EVIDENCE_RTT = [
  { n: "Least-congested", v: 0.30, ci: 0.03, t: "good" },
  { n: "Least-congested, class-aware", v: 0.31, ci: 0.03, t: "good" },
  { n: "Shortest path", v: 7.57, ci: 0.48, t: "bad" },
];
const EVIDENCE_JITTER = [
  { n: "Least-congested", v: 0.032, ci: 0.002, t: "good" },
  { n: "Least-congested, class-aware", v: 0.037, ci: 0.005, t: "good" },
  { n: "Shortest path", v: 1.55, ci: 0.05, t: "bad" },
];

function EvidenceChart({ rows, max, dec = 1, unit = "" }) {
  return (
    <div className="ev-chart">
      {rows.map(r => (
        <div className="ev-row" key={r.n}>
          <span className="ev-nm">{r.n}</span>
          <div className="ev-track">
            <div className={`ev-fill ${r.t}`} style={{ width: `${(r.v / max) * 100}%` }} />
            {r.ci > 0 && <div className="ev-ci" style={{ left: `${((r.v - r.ci) / max) * 100}%`, width: `${(2 * r.ci / max) * 100}%` }} />}
          </div>
          <span className="ev-v">{r.v.toFixed(dec)}{unit}</span>
        </div>
      ))}
    </div>
  );
}

function ResultsView() {
  return (
    <div className="res-wrap">
      <div className="res-hero">
        <div className="res-stat"><div className="num">+14.2 Mbps</div><div className="lbl">placement-aware routing vs random, six simultaneous flows, better in 15 of 15 runs</div></div>
        <div className="res-stat bad"><div className="num">&minus;11.2 Mbps</div><div className="lbl">plain least-congested routing on the same test: worse than random</div></div>
        <div className="res-stat"><div className="num">28 ms</div><div className="lbl">a flow is cut by a link failure before it reroutes (10 repetitions)</div></div>
        <div className="res-stat"><div className="num">0.3 vs 7.6 ms</div><div className="lbl">ping delay beside bulk TCP: load-aware routing vs shortest path</div></div>
      </div>

      <div className="panel">
        <h2 className="panel-title">Six flows start at the same moment</h2>
        <p className="cmp-text">Delivered throughput in Mbps (50.3 sent). Mean of 15 paired repetitions; the thin bar is the 95% confidence interval.</p>
        <EvidenceChart rows={EVIDENCE_SIMULTANEOUS} max={52} />
        <p className="res-note">Plain least-congested routing reads statistics that refresh every 0.5 s, so flows that start together all see an idle network and pile onto one path. Reserving each new flow's expected load on its path (<i>placement memory</i>) fixes this completely.</p>
      </div>

      <div className="panel">
        <h2 className="panel-title">A background flow already loads one path</h2>
        <p className="cmp-text">One 8 Mbps flow is pinned to a path; six flows then arrive 2.5 s apart. 15 paired repetitions.</p>
        <EvidenceChart rows={EVIDENCE_BACKGROUND} max={52} />
        <p className="res-note">Every load-aware algorithm steers around the loaded path and leaves the background flow almost untouched. Load-blind routing cannot.</p>
      </div>

      <div className="panel">
        <h2 className="panel-title">Eight flows start at the same moment</h2>
        <p className="cmp-text">Delivered throughput in Mbps (67.1 sent). 15 paired repetitions. The agent was trained on six flows only.</p>
        <EvidenceChart rows={EVIDENCE_EIGHT} max={72} />
        <p className="res-note">Placement memory still delivers everything that was sent. The trained agent is no better than random at eight flows; retraining it on eight flows made it worse (29.2 Mbps), because it has no memory of where it just placed flows.</p>
      </div>

      <div className="panel">
        <h2 className="panel-title">Mixed UDP and TCP traffic</h2>
        <p className="cmp-text">UDP delivered in Mbps (25.2 sent) with three TCP flows running at the same time. Mean of 15 repetitions.</p>
        <EvidenceChart rows={EVIDENCE_MIXED} max={27} />
        <p className="res-note">Only placement memory helps (UDP loss 0% in every run; total throughput +6.1 &plusmn; 2.4 Mbps against random). Class-aware routing is not better than random here. TCP figures are noisier because each TCP flow is capped by a meter shared per switch.</p>
      </div>

      <div className="res-two">
        <div className="panel">
          <h2 className="panel-title">How long a link failure cuts a flow</h2>
          <p className="cmp-text">Milliseconds without a reply, ping every 5 ms, 10 repetitions. Lower is better.</p>
          <EvidenceChart rows={EVIDENCE_FAILURE} max={45} dec={0} unit=" ms" />
          <p className="res-note">With both uplinks of the source switch down there were no replies in all 20 runs: the switch is isolated and the controller reports it.</p>
        </div>
        <div className="panel">
          <h2 className="panel-title">Delay beside bulk TCP</h2>
          <p className="cmp-text">Ping round-trip time in milliseconds, three TCP bulk flows running. Lower is better.</p>
          <EvidenceChart rows={EVIDENCE_RTT} max={9} dec={2} unit=" ms" />
          <p className="cmp-text" style={{ marginTop: 18 }}>UDP jitter in milliseconds, same test.</p>
          <EvidenceChart rows={EVIDENCE_JITTER} max={1.8} dec={3} unit=" ms" />
        </div>
      </div>

      <div className="res-two">
        <div className="panel">
          <h2 className="panel-title">What the project shows</h2>
          <ul className="res-list">
            <li>Load-aware multipath routing delivers up to <b>2.6 times</b> the throughput of shortest-path routing on the same network.</li>
            <li>Routing that is blind to load is no better than choosing at random.</li>
            <li>Remembering where flows were just placed matters as much as measuring load: without it, load-aware routing is <b>worse than random</b> for simultaneous arrivals.</li>
            <li>Beside bulk TCP, load-aware routing keeps UDP delay about 25 times and jitter about 50 times lower.</li>
            <li>A failed link is routed around in tens of milliseconds, and an isolated switch is reported as unreachable rather than silently failing.</li>
          </ul>
        </div>
        <div className="panel">
          <h2 className="panel-title">What it does not show</h2>
          <ul className="res-list">
            <li>The Q-learning agent <b>matches</b> the best heuristic where it was trained but never beats it; with eight simultaneous flows it is no better than random, and retraining it on eight made it worse.</li>
            <li>Class-aware (QoS) routing was not measurably better than plain least-congested routing.</li>
            <li>The anomaly detector is stable but cannot tell a flood from legitimate full-rate traffic.</li>
            <li>One 10-switch topology, UDP flows of one size, emulation rather than hardware.</li>
          </ul>
        </div>
      </div>
      <div className="res-foot">All results: 10 Mbps links, 8 Mbps UDP flows, fresh controller per run, same flows for every algorithm within a repetition. Full method in the written report.</div>
    </div>
  );
}

function App() {
  const [tab, setTab] = useState("live");
  return (
    <React.Fragment>
      <div className="tabs">
        {[["live", "Live"], ["compare", "Compare"], ["results", "Results"]].map(([id, label]) => (
          <button key={id} className={`tab ${tab === id ? "on" : ""}`} onClick={() => setTab(id)}>{label}</button>
        ))}
      </div>
      <div style={{ display: tab === "live" ? "block" : "none" }}><LiveView /></div>
      {tab === "compare" && <CompareView />}
      {tab === "results" && <ResultsView />}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
